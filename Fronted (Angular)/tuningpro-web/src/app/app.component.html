<!-- ================= LOGIN ================= -->
<app-login *ngIf="!auth.logueado" (ingreso)="alIngresar()"></app-login>

<!-- ================= APLICACIÓN ================= -->
<ng-container *ngIf="auth.logueado">

  <div class="barra">
    <div>
      <strong>{{ auth.sesion?.nombreCompleto }}</strong>
      <span class="rol">{{ auth.rol }}</span>
    </div>
    <button (click)="cerrarSesion()">Cerrar sesión</button>
  </div>

  <h1>TuningPro – Taller de Personalización Automotriz</h1>

  <!-- Menú según el rol -->
  <div class="menu" *ngIf="menu.length > 0">
    <button *ngFor="let m of menu" [routerLink]="'/' + m.ruta" routerLinkActive="activo">
      {{ m.texto }}
    </button>
  </div>

  <!-- Aquí se muestra la pantalla según la URL -->
  <router-outlet></router-outlet>

</ng-container>
