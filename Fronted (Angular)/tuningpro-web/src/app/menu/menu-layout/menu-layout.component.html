<div class="layout">

  @if (isSidebarOpen) {
    <div class="overlay" (click)="closeSidebar()"></div>
  }

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="#5c8dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2a2 2 0 0 1 1.9 1.5L21 13"/>
        <path d="M3 13h18v4a1 1 0 0 1-1 1h-2v-2H6v2H4a1 1 0 0 1-1-1v-4Z"/>
        <circle cx="7" cy="17.5" r="1.3" fill="#5c8dff"/>
        <circle cx="17" cy="17.5" r="1.3" fill="#5c8dff"/>
      </svg>
      <div>
        <div class="brand-name">TuningPro</div>
        <div class="brand-sub">Gestión técnica</div>
      </div>
    </div>

    <nav class="nav">
      @for (item of itemsMenu; track item.ruta) {
        <a class="nav-item" [routerLink]="item.ruta" routerLinkActive="active" (click)="closeSidebar()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @switch (item.icono) {
              @case ('inventario') { <path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/> }
              @case ('proyectos') { <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/> }
              @case ('ordenes') { <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/> }
              @case ('historial') { <circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/> }
              @case ('reportes') { <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/> }
              @case ('gestion') { <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/> }
            }
          </svg>
          <span>{{ item.texto }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="avatar">{{ iniciales }}</div>
      <div class="user-info">
        <div class="user-name">{{ nombreCompleto }}</div>
        <div class="user-role">{{ rol }}</div>
      </div>
      <button type="button" class="logout-btn" (click)="cerrarSesion()" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <div class="content-area">
    <header class="topbar">
      <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="topbar-spacer"></div>

      <div class="topbar-user">
        <span class="role-badge">{{ rol }}</span>
        <span class="topbar-user-name">{{ nombreCompleto }}</span>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
